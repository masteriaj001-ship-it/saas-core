models:
  Asset:
    tenant_id: uuid index
    name: string:100
    type: string:50        # Ex: 'equipment', 'vehicle', 'machinery'
    metadata: json         # Atributos dinámicos de la industria
    status: string:30
    timestamps: true

  Item:
    tenant_id: uuid index
    sku: string:60 unique
    name: string:150
    description: text nullable
    stock: integer default:0
    price: decimal:10,2
    timestamps: true

  Contact:
    tenant_id: uuid index
    type: string:30        # Ex: 'client', 'provider', 'lead'
    name: string:150
    email: string:150 nullable
    phone: string:40 nullable
    identification: string:50 nullable # Cédula, NIT, Pasaporte
    timestamps: true