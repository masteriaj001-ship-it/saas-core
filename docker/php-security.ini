; Hardening de PHP — mitigaciones de CVE-2026-109618 (RCE via OOM corruption) y
; CVE-2026-109619 (RCE via stale global state), publicadas el 21-oct-2026.
; Contenido en línea con las directrices oficiales de PHP y CERT-EU (advisory 2026-018).
; El parche definitivo es PHP >= 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35; estas directivas
; cubren instalaciones que no pueden actualizarse de inmediato y reducen DoS.
;
; memory_limit NO se fija aquí: queda el de la imagen base (128M en prod con
; php:8.5.12-fpm-alpine, -1 en Sail/dev). Con el parche 8.5.12 el OOM se gestiona
; de forma segura (soft OOM en el siguiente safe point + hard OOM con _exit()), así
; que un límite finito es preferible en prod: evita que una petición agote la RAM
; del host. El memory_limit=-1 solo es la mitigación recomendada por PHP para
; instalaciones SIN parche, y ya no aplica aquí. NO usar RLIMIT_AS ni RLIMIT_DATA:
; provocan el fallo de mmap() y reactivan la ruta de longjmp() vulnerable.

; Elimina el productor confirmado de CVE-2026-109619 (backtrace de error fatal
; almacenado en estado global persistente del worker).
fatal_error_backtraces=0

; Elimina el consumidor/productor confirmado por session upload progress
; (mismo worker, request posterior). La app no usa esta funcionalidad.
session.upload_progress.enabled=0

; Tamaño máximo del body decodificado. Coherente con client_max_body_size 20M
; de docker/nginx-default.conf; antes PHP aceptaba 100M (más superficie de OOM).
post_max_size=20M

; Tamaño máximo por fichero subido.
upload_max_filesize=20M

; Reduce la anidación de variables de entrada (por defecto 64).
max_input_nesting_level=16
